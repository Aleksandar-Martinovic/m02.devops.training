version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - sem-version python 3.12
      - checkout
      - mkdir -p .pip_cache
blocks:
  - name: 'Block 1: Install Dependecies'
    dependencies: []
    task:
      jobs:
        - name: "\U0001F7E2 Run Tests"
          commands:
            - pip install pytest requests flask coverage locust
  - name: 'Block 2: Unit tests'
    dependencies:
      - 'Block 1: Install Dependecies'
    task:
      jobs:
        - name: Exercise 1 & Exercise 2
          commands:
            - cd 1-tdd && python -m pytest test_factorial.py -v
            - cd ../2-unit-testing && python -m pytest test_math_sum.py -v
  - name: 'Block 3: Integration tests'
    dependencies:
      - 'Block 1: Install Dependecies'
    task:
      jobs:
        - name: Exercise 3
          commands:
            - cd 3-integration-testing && python -m pytest test_integration.py -v
  - name: 'Block 4: End-to-end tests'
    dependencies:
      - 'Block 1: Install Dependecies'
    task:
      jobs:
        - name: Exercise 4
          commands:
            - cd 4-e2e && nohup python app.py &
            - sleep 3
            - ls && python -m pytest test_e2e.py -v
  - name: 'Block 5: Test reports'
    dependencies:
      - 'Block 1: Install Dependecies'
    task:
      jobs:
        - name: Exercise 5
          commands:
            - cd 5-test-reports
            - pip install -r requirements.txt
            - pytest --junitxml=reports.xml
            - '[[ -f report.xml ]] && test-results publish report.xml'
after_pipeline:
  task:
    jobs:
      - name: Test reports
        commands:
          - test-results gen-pipeline-report
